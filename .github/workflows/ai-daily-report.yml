name: AI Daily Report to Feishu

on:
  schedule:
    # GitHub Actions uses UTC. 00:50 UTC is 08:50 in Asia/Shanghai.
    # Later entries retry if GitHub drops or fails the primary schedule.
    - cron: "50 0 * * *"
    - cron: "20 1 * * *"
    - cron: "50 1 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Only send a Feishu connectivity test"
        required: false
        type: boolean
        default: false

concurrency:
  group: ai-daily-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check for an earlier successful scheduled report
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          successful_runs="$(gh api \
            "repos/$GH_REPO/actions/workflows/ai-daily-report.yml/runs?event=schedule&status=success&per_page=30" \
            --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID and (.created_at | startswith(\"$today\"))) | .id")"

          if [ -n "$successful_runs" ]; then
            echo "A scheduled report already succeeded today; skipping this retry."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  daily-report:
    needs: schedule-guard
    if: ${{ needs.schedule-guard.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Validate configuration
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: uv run python -m trendradar --doctor

      - name: Test Feishu notification
        if: ${{ inputs.test_notification == true }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: uv run python -m trendradar --test-notification

      - name: Generate and push AI daily report
        if: ${{ inputs.test_notification != true }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: "true"
        run: uv run python -m trendradar

      - name: Upload report for troubleshooting
        if: ${{ always() && inputs.test_notification != true }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-report-${{ github.run_id }}
          path: |
            output/html/
            output/meta/
          if-no-files-found: warn
          retention-days: 14
